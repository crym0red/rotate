name: Build MRzefvRotate.dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        continue-on-error: true
        run: brew install ldid

      - name: Build dylib (errors do not stop the job)
        continue-on-error: true
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show errors in summary
        if: always()
        run: |
          {
            echo '### build.log (errors)'
            echo '```'
            grep -n "error" build/build.log | head -40 || echo "no errors"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dylib + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MRzefvRotate-build
          path: |
            build/MRzefvRotate.dylib
            build/build.log
          if-no-files-found: warn
